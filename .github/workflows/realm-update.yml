name: Apply validated realm update

on:
  push:
    branches: [feat/realm-expansion]
    paths:
      - '.realm-update/**'
      - '.github/workflows/realm-update.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/realm-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/realm-expansion
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Decode and apply locally validated patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          text = ''.join(Path(f'.realm-update/part-{i}').read_text() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '81163d58b809e3c22f0ec8c1d63f7bbe0e7db1111de856324b3da1b3b4b28cc3'
          Path('/tmp/realm-update.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --index /tmp/realm-update.patch
      - name: Verify exact tested source contents
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
            'AGENTS.md':'d25d5dfd6fb48d9e28b8e623e2bcd9085b5afc8f',
            'PROJECT_MEMORY.md':'d0c15bd976c975c5d1ceca009a08f9e0d4849927',
            'README.md':'293e779ba9eb2c65c02d990f32e1c5a1dc08e35d',
            'docs/ARCHITECTURE.md':'c1b60aa44ae8f3b2dfb47aa054d1621cfd4bf5df',
            'docs/TEST_REPORT.md':'fad0226f5ab86a16fc79038ae92c41b4eb3cfe8e',
            'docs/TEST_REPORT_1.8.0.md':'5b1a47c094533aa670332a0f3d07c75b118a1e0a',
            'package.json':'7e777948de3c8e5ec4e1714def7c5b06e3215dee',
            'public/js/app.js':'aab75d5d371530ed0c3e8c1a842e8f9d2db670d2',
            'public/js/data.js':'05c868ba8b3e13954780799652862d6e47ae1230',
            'public/js/engine.js':'37862f238c6db48a76d920df9145abf2ecf28b8b',
            'public/js/storage.js':'a9ec0a0477274bab4eeeadebe68cbfa0f0a10e6b',
            'tests/browser-smoke.py':'3655317b0edd89364d4a25c12f53c372b941af42',
            'tests/engine.test.mjs':'4f0f768396c8dbc0bbea3d6799e588bce89b1a33',
            'tests/gameplay-unlocks.test.mjs':'d740ffe88616ab6bacefe653ce8ba38b6323f14e',
            'tests/realms.test.mjs':'3dcbf1bf9e87003d41b4106dceb852c6a605e932',
            'tests/realtime.test.mjs':'648571da0be30061465fda8ada4005d93a7a10ef'
          }
          changed = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert set(changed) == set(expected), changed
          for path, sha in expected.items():
              actual = subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual == sha, (path, actual, sha)
              print(path, actual)
          PY
          git diff --cached --check
      - name: Validate rules and static build before committing
        run: npm run check && npm test && npm run build
      - name: Commit tested product changes on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '凡人单境界，补充炼虚至渡劫并迁移旧档'
          git push origin HEAD:refs/heads/feat/realm-expansion
