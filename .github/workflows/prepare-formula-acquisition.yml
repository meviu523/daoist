name: Prepare formula acquisition changes
on:
  push:
    branches: [feature/differentiated-formula-acquisition]
    paths: [.github/workflows/prepare-formula-acquisition.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'meviu523/daoist' && github.ref == 'refs/heads/feature/differentiated-formula-acquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Apply hash-verified source edits
        run: |
          python3 .github/formula-core-edits.py
          python3 .github/formula-docs-edits.py
          python3 .github/formula-tests-edits.py
      - name: Validate and commit feature sources
        shell: bash
        run: |
          npm run check
          npm test
          npm run build
          git add -- package.json public/js/data.js public/js/engine.js public/js/app.js public/js/progression.js tests/browser-smoke.py tests/engine.test.mjs tests/formula-acquisition.test.mjs README.md PROJECT_MEMORY.md docs/ARCHITECTURE.md docs/TEST_REPORT.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separate formula acquisition into story, bonds and shop'
          git push origin HEAD:refs/heads/feature/differentiated-formula-acquisition
