          data=gzip.decompress(base64.b64decode(''.join(payload.split()),validate=True))
          assert hashlib.sha256(data).hexdigest() == 'c0a76f31c10697dce4fdcc2e274fd1d6b106c6a5a3c3c0024d6541fc839f432d'
          plan=json.loads(data)
          allowed={'PROJECT_MEMORY.md','README.md','docs/ARCHITECTURE.md','docs/TEST_REPORT.md','package.json','public/js/app.js','public/js/data.js','public/js/engine.js','public/js/progression.js','tests/browser-smoke.py','tests/engine.test.mjs','tests/formula-acquisition.test.mjs'}
          assert {x['path'] for x in plan} == allowed and len(plan)==len(allowed)
          writes=[]
          for entry in plan:
              path=pathlib.Path(entry['path'])
              old=path.read_text() if path.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==entry['before'],str(path)
              new=old
              for start,end,insert in reversed(entry['edits']):
                  assert 0<=start<=end<=len(old)
                  new=new[:start]+insert+new[end:]
              assert hashlib.sha256(new.encode()).hexdigest()==entry['after'],str(path)
              writes.append((path,new))
          for path,new in writes:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(new)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
