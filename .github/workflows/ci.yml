name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.16.0"
          package-manager-cache: false
      - name: Validate source
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Chromium interaction checks
        run: python tests/browser-smoke.py
      - name: Archive reproducible validation inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-source
          retention-days: 3
          path: |
            public/
            tests/
            scripts/
            docs/*.md
            README.md
            PROJECT_MEMORY.md
            package.json
            server.mjs
