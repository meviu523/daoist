name: Integrate validated delivery results with realm update
on:
  push:
    branches: [feat/delivery-results-1.8.0]
    paths: ['.delivery-integration/**', '.github/workflows/integrate-delivery-results.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/delivery-results-1.8.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge pinned main without dropping concurrent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse origin/main)" = '13a1200059fcf476cee722d19f78822f4d07284e'
          git merge-base --is-ancestor 6ec51e9d3f9acb770b105d1e4dd04de23fc1dd54 HEAD
          git merge --no-commit --no-ff 13a1200059fcf476cee722d19f78822f4d07284e || test -f .git/MERGE_HEAD
      - name: Apply locally tested and hash-verified conflict resolution
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil, subprocess
          allowed={'PROJECT_MEMORY.md','README.md','docs/ARCHITECTURE.md','docs/TEST_REPORT.md','docs/TEST_REPORT_1.8.0.md','docs/TEST_REPORT_1.9.0.md','package.json','public/js/app.js','public/js/data.js','public/js/engine.js','public/js/storage.js','tests/browser-smoke.py','tests/engine.test.mjs','tests/event-results.test.mjs','tests/gameplay-unlocks.test.mjs','tests/realms.test.mjs','tests/realtime.test.mjs'}
          parents={'6ec51e9d3f9acb770b105d1e4dd04de23fc1dd54','13a1200059fcf476cee722d19f78822f4d07284e'}
          encoded=''.join(pathlib.Path(f'.delivery-integration/part-{i}.b64').read_text().strip() for i in range(3))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True))
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert digest(raw)=='b04daf96c7e334cacb739ef1a6e8db62515f1a3df3b8b88b7cd8ffc92d1642e7','transport mismatch'
          edits=json.loads(raw)
          assert len(edits)==len(allowed) and {e[0] for e in edits}==allowed
          outputs=[]
          for name,ref,before,after,ops in edits:
              assert ref in parents
              old=subprocess.run(['git','show',f'{ref}:{name}'],stdout=subprocess.PIPE,stderr=subprocess.PIPE).stdout
              assert digest(old)==before,f'baseline mismatch: {name}'
              lines=old.decode('utf-8').splitlines(keepends=True);last=len(lines)
              for start,end,replacement in reversed(ops):
                  assert 0<=start<=end<=last
                  lines[start:end]=replacement;last=start
              new=''.join(lines).encode('utf-8')
              assert digest(new)==after,f'output mismatch: {name}'
              outputs.append((pathlib.Path(name),new))
          for path,content in outputs:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content)
              print(f'Verified {path}: {digest(content)}')
          assert subprocess.check_output(['git','hash-object','AGENTS.md'],text=True).strip()=='d25d5dfd6fb48d9e28b8e623e2bcd9085b5afc8f','concurrent instructions lost'
          shutil.rmtree('.delivery-integration')
          subprocess.run(['git','add','-u'],check=True)
          subprocess.run(['git','add',*sorted(allowed)],check=True)
          assert not subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).strip(),'unresolved conflicts'
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Validate merged source
        run: |
          git diff --cached --check
          npm run check
          npm test
          npm run build
      - name: Commit both parents to the feature branch only
        run: |
          test -f .git/MERGE_HEAD
          git commit -m 'merge: preserve realm expansion and release choice outcomes as 1.9.0 / v14'
          git push origin HEAD:feat/delivery-results-1.8.0
