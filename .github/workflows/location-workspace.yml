name: Location change workspace
on:
  push:
    branches: [feature/delivery-location-unlocks]
    paths: [.github/workflows/location-workspace.yml, scripts/location-change.patch]
permissions:
  contents: write
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Apply hash-verified location changes
        if: hashFiles('scripts/location-change.patch') != ''
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          raw = lzma.decompress(base64.b64decode(Path('scripts/location-change.patch').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'dd7566b821165b83520c8702a39ed1cbee233ba2abd53be9e83a950bc47276ca'
          records = json.loads(raw)
          allowed = set('PROJECT_MEMORY.md README.md docs/ARCHITECTURE.md docs/TEST_REPORT.md package.json public/js/app.js public/js/data.js public/js/engine.js public/js/map.js public/js/storage.js tests/auction.test.mjs tests/browser-smoke.py tests/engine.test.mjs tests/expansion.test.mjs tests/formula-acquisition.test.mjs tests/gameplay-unlocks.test.mjs tests/location-unlocks.test.mjs tests/map-background.test.mjs tests/realtime.test.mjs'.split())
          assert len(records) == len(allowed) and {r['path'] for r in records} == allowed
          prepared = {}
          for record in records:
              path = Path(record['path'])
              assert (path.exists() if record['before'] else not path.exists()), path
              before = path.read_text() if path.exists() else ''
              if record['before']:
                  assert hashlib.sha256(before.encode()).hexdigest() == record['before'], path
              end = 0
              for start, stop, text in record['ops']:
                  assert end <= start <= stop <= len(before), path
                  end = stop
              after = before
              for start, stop, text in reversed(record['ops']):
                  after = after[:start] + text + after[stop:]
              assert hashlib.sha256(after.encode()).hexdigest() == record['after'], path
              prepared[path] = after
          for path, text in prepared.items():
              path.write_text(text)
              print('Verified', path)
          PY
          git diff --check
          npm run check
          npm test
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public tests docs README.md PROJECT_MEMORY.md package.json
          git commit -m 'feat: unlock city locations through completed deliveries'
          git push origin HEAD:refs/heads/feature/delivery-location-unlocks
      - name: Export workspace for verification
        if: always()
        run: git archive HEAD -o /tmp/location-workspace.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-workspace
          path: /tmp/location-workspace.tar
          retention-days: 1
