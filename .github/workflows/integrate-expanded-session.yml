name: Integrate expanded map and background session
on:
  push:
    branches: [feat/expanded-city-background-clock]
    paths:
      - .github/workflows/integrate-expanded-session.yml
      - .github/integration-expanded-session.json
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Materialize and verify locally tested source against current release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request
          manifest = json.loads(pathlib.Path('.github/integration-expanded-session.json').read_text())
          assert len(manifest) == 16
          pending = []
          for item in manifest:
              path = pathlib.Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('public/js/', 'tests/', 'docs/')) or str(path) in ('AGENTS.md','PROJECT_MEMORY.md','README.md','package.json')
              current = path.read_bytes() if path.exists() else b''
              assert (hashlib.sha256(current).hexdigest() if current else None) == item['before'], f'Base changed: {path}'
              if item['source'] == 'current':
                  raw = current
              else:
                  blob_sha = item['source']
                  assert re.fullmatch('[0-9a-f]{40}', blob_sha)
                  url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{blob_sha}"
                  request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'daoist-source-integration'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      blob = json.load(response)
                  assert blob['encoding'] == 'base64'
                  raw = base64.b64decode(blob['content'])
                  assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == blob_sha
              content = raw.decode('utf-8')
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(content)
                  content = content[:start]+replacement+content[end:]
              result = content.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['after'], f'Result mismatch: {path}'
              pending.append((path,result))
          for path, result in pending:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
              print('Verified',path,hashlib.sha256(result).hexdigest())
          pathlib.Path('/tmp/expanded-session-paths').write_bytes(b'\0'.join(str(path).encode() for path,_ in pending)+b'\0')
          PY
      - name: Validate syntax, all rules and build
        run: npm run check && npm test && npm run build
      - name: Commit verified source and remove one-time integration files
        run: |
          rm .github/workflows/integrate-expanded-session.yml .github/integration-expanded-session.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/expanded-session-paths --pathspec-file-nul
          git add -u .github/workflows/integrate-expanded-session.yml .github/integration-expanded-session.json
          git diff --cached --check
          git commit -m 'feat: 110-place map and uninterrupted background session'
          git push origin HEAD:refs/heads/feat/expanded-city-background-clock
