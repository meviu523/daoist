name: Prepare auction house feature
on:
  push:
    branches: [feature/auction-house]
    paths: [.github/workflows/prepare-auction.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'meviu523/daoist' && github.ref == 'refs/heads/feature/auction-house'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          package-manager-cache: false
      - name: Apply per-file hash-verified edits
        run: |
          git merge-base --is-ancestor 52f8c65a3d1dc811352f0d27f1d389e933558240 HEAD
          python3 .github/auction-core-edits.py
          python3 .github/auction-ui-edits.py
          python3 .github/auction-unit-edits.py
          python3 .github/auction-browser-edits.py
          python3 .github/auction-docs-edits.py
      - name: Validate and commit feature sources
        shell: bash
        run: |
          npm run check
          npm test
          npm run build
          git add -- package.json public/js/data.js public/js/engine.js public/js/storage.js public/js/app.js public/styles.css tests/gameplay-unlocks.test.mjs tests/auction.test.mjs tests/browser-smoke.py README.md PROJECT_MEMORY.md docs/ARCHITECTURE.md docs/TEST_REPORT.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add progressive nightly auction house'
          git push origin HEAD:refs/heads/feature/auction-house
